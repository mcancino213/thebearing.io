<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — TheBearing Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c17f3e;--gold2:#d4924f;}
html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 440px;}
.left{background:#0f1117;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.left::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;}
.left::after{content:'';position:absolute;bottom:-100px;left:-60px;width:500px;height:500px;background:radial-gradient(circle,rgba(193,127,62,.1) 0%,transparent 70%);pointer-events:none;}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
.mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#a06428);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:800;color:#fff;}
.bname{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;color:#fff;}
.btag{font-size:.62rem;color:rgba(255,255,255,.3);letter-spacing:.08em;text-transform:uppercase;margin-top:1px;}
.headline{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;line-height:1.1;color:#fff;margin-bottom:14px;letter-spacing:-.02em;position:relative;z-index:1;}
.sub{font-size:.86rem;color:rgba(255,255,255,.5);line-height:1.65;position:relative;z-index:1;}
.stats{display:flex;gap:28px;position:relative;z-index:1;}
.sn{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:var(--gold);margin-bottom:2px;}
.sl{font-size:.68rem;color:rgba(255,255,255,.3);letter-spacing:.06em;text-transform:uppercase;}
.right{background:#fff;display:flex;align-items:center;justify-content:center;padding:48px 52px;border-left:1px solid #e5e7eb;}
.form{width:100%;max-width:320px;}
.title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:3px;color:#0f1117;}
.subtitle{font-size:.8rem;color:#9ca3af;margin-bottom:24px;}
.field{margin-bottom:12px;}
label{font-size:.74rem;font-weight:500;color:#4b5563;display:block;margin-bottom:4px;}
input{width:100%;padding:9px 12px;background:#f8f9fb;border:1px solid #d1d5db;border-radius:7px;color:#0f1117;font-size:.84rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(193,127,62,.1);}
.btn{width:100%;padding:10px;background:var(--gold);color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:600;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--gold2);}
.notice{margin-top:14px;padding:10px 12px;background:#f8f9fb;border:1px solid #e5e7eb;border-radius:7px;font-size:.74rem;color:#9ca3af;display:flex;gap:8px;line-height:1.55;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="brand"><div class="mark">TB</div><div><div class="bname">TheBearing.io</div><div class="btag">Admin Portal</div></div></div>
    <div>
      <div class="headline">The command<br>centre for<br><span style="color:var(--gold);">curated travel.</span></div>
      <div class="sub">Manage properties, guests, bookings, and platform health from one workspace.</div>
    </div>
    <div class="stats">
      <div><div class="sn">24</div><div class="sl">Properties live</div></div>
      <div><div class="sn">$284k</div><div class="sl">GMV this month</div></div>
      <div><div class="sn">1,284</div><div class="sl">Members</div></div>
    </div>
  </div>
  <div class="right">
    <div class="form">
      <div class="title">Sign in</div>
      <div class="subtitle">Team access only</div>
      <div class="field"><label>Email</label><input type="email" placeholder="you@thebearing.io"></div>
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••••"></div>
      <button class="btn" onclick="window.location='admin-dashboard.html'">Sign in →</button>
      <div class="notice"><div class="dot"></div><div>Access restricted to TheBearing team. Contact Miguel to request access.</div></div>
    </div>
  </div>
</div>
</body></html>
