<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Conversations — The Bearing</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf7f1;--ink:#1e1810;--terra:#b05830;--gold:#9a7230;--sand:#ece5d8;--stone:#7a6a58;--bark:#5a4a38;--border:#e8dfd0;--nav-h:66px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Geist',sans-serif;background:var(--cream);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Nav */
.nav{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(250,247,241,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100;}
.nav-logo{font-family:'Instrument Serif',serif;font-size:1.2rem;color:var(--ink);text-decoration:none;}
.nav-logo span{color:var(--terra);font-family:'Geist',sans-serif;font-size:.8em;}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-user{font-size:.78rem;color:var(--stone);}
.nav-signout{font-size:.72rem;color:var(--terra);cursor:pointer;background:none;border:none;font-family:'Geist',sans-serif;}

/* Layout: sidebar + main */
.app-body{flex:1;display:flex;overflow:hidden;}

/* Sidebar: conversation list */
.conv-sidebar{width:320px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:#fff;}
.conv-sidebar-header{padding:20px 20px 14px;border-bottom:1px solid var(--border);}
.conv-sidebar-title{font-family:'Instrument Serif',serif;font-size:1.1rem;color:var(--ink);}
.conv-sidebar-sub{font-size:.7rem;color:var(--stone);margin-top:2px;}
.conv-list{flex:1;overflow-y:auto;}
.conv-item{padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;display:flex;gap:12px;align-items:flex-start;}
.conv-item:hover{background:var(--cream);}
.conv-item.active{background:#fdf5ee;border-left:3px solid var(--terra);}
.conv-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--terra),#8c4422);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-style:italic;color:#fff;font-size:1rem;flex-shrink:0;}
.conv-meta{flex:1;min-width:0;}
.conv-prop{font-size:.84rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-preview{font-size:.72rem;color:var(--stone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.conv-time{font-size:.62rem;color:var(--stone);flex-shrink:0;margin-top:2px;}
.conv-unread{width:8px;height:8px;border-radius:50%;background:var(--terra);flex-shrink:0;margin-top:6px;}

/* Empty sidebar */
.conv-empty{padding:40px 20px;text-align:center;color:var(--stone);}
.conv-empty svg{margin-bottom:12px;opacity:.3;}

/* Main: message thread */
.conv-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.conv-main-header{padding:16px 24px;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center;gap:14px;flex-shrink:0;}
.conv-main-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--terra),#8c4422);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-style:italic;color:#fff;font-size:.9rem;flex-shrink:0;}
.conv-main-title{font-size:.92rem;font-weight:600;color:var(--ink);}
.conv-main-sub{font-size:.68rem;color:var(--stone);margin-top:1px;}
.conv-status{margin-left:auto;font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:100px;background:#dcfce7;color:#166534;}

/* Messages */
.messages-wrap{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
.msg{display:flex;flex-direction:column;max-width:72%;}
.msg.guest{align-self:flex-end;align-items:flex-end;}
.msg.property{align-self:flex-start;align-items:flex-start;}
.msg-bubble{padding:11px 15px;border-radius:18px;font-size:.84rem;line-height:1.6;word-break:break-word;}
.msg.guest .msg-bubble{background:var(--terra);color:#fff;border-radius:18px 18px 4px 18px;}
.msg.property .msg-bubble{background:#fff;border:1px solid var(--border);color:var(--ink);border-radius:18px 18px 18px 4px;}
.msg-meta{font-size:.6rem;color:var(--stone);margin-top:3px;padding:0 4px;}
.msg-sender{font-size:.62rem;font-weight:600;color:var(--stone);margin-bottom:4px;padding:0 4px;}

/* Input */
.conv-input-wrap{padding:14px 20px;border-top:1px solid var(--border);background:#fff;display:flex;gap:10px;align-items:flex-end;}
.conv-input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:20px;font-family:'Geist',sans-serif;font-size:.84rem;color:var(--ink);outline:none;resize:none;max-height:120px;line-height:1.5;transition:border-color .15s;}
.conv-input:focus{border-color:var(--terra);}
.conv-send-btn{width:38px;height:38px;border-radius:50%;background:var(--terra);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.conv-send-btn:hover{background:#8c4422;}
.conv-send-btn:disabled{opacity:.4;cursor:not-allowed;}

/* No conversation selected */
.no-conv-selected{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--stone);text-align:center;padding:40px;}
.no-conv-selected svg{margin-bottom:16px;opacity:.2;}

/* Auth gate */
.auth-gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;}
.auth-gate-title{font-family:'Instrument Serif',serif;font-size:1.6rem;color:var(--ink);margin-bottom:8px;}
.auth-gate-sub{font-size:.84rem;color:var(--stone);margin-bottom:24px;line-height:1.6;}
.auth-gate-btn{padding:12px 28px;background:var(--terra);color:#fff;border:none;border-radius:100px;font-family:'Geist',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;}

/* Mobile */
@media(max-width:767px){
  .conv-sidebar{width:100%;border-right:none;display:none;}
  .conv-sidebar.mobile-show{display:flex;}
  .conv-main{display:none;}
  .conv-main.mobile-show{display:flex;}
  .back-btn{display:flex !important;}
}
.back-btn{display:none;align-items:center;gap:6px;background:none;border:none;color:var(--stone);font-family:'Geist',sans-serif;font-size:.8rem;cursor:pointer;padding:0;}

/* Enquiry summary pill */
.enq-summary{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:.72rem;color:var(--stone);line-height:1.6;margin-bottom:8px;align-self:center;max-width:90%;text-align:center;}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">The Bearing<span>.io</span></a>
  <div class="nav-right">
    <span class="nav-user" id="nav-user-name"></span>
    <button class="nav-signout" id="nav-signout-btn" onclick="tbAuth.signOut(function(){window.location='/';})">Sign out</button>
  </div>
</nav>

<div class="app-body" id="app-body">
  <!-- Auth gate shown while checking -->
  <div class="auth-gate" id="auth-gate">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2 2h12v9H9l-3 3v-3H2z"/></svg>
    <div class="auth-gate-title">Your conversations</div>
    <div class="auth-gate-sub">Sign in to view your enquiries and messages with properties.</div>
    <button class="auth-gate-btn" onclick="tbAuth.showSignIn({title:'Sign in to view conversations',onSuccess:loadConversations})">Sign in</button>
  </div>
</div>

<script src="/assets/auth.js"></script>
<script>
var conversations = [];
var activeConvId = null;
var pollInterval = null;

// ── Init ──────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  tbAuth.loadClerk(function() {
    var user = tbAuth.getUser();
    if (user) {
      loadConversations(user);
    } else {
      // Show auth gate
      document.getElementById('auth-gate').style.display = 'flex';
    }
  });
});

function loadConversations(user) {
  if (!user) user = tbAuth.getUser();
  if (!user) return;

  // Update nav
  document.getElementById('nav-user-name').textContent = (user.firstName || user.emailAddresses[0]?.emailAddress || '');

  // Build real UI
  var appBody = document.getElementById('app-body');
  appBody.innerHTML = '<div class="conv-sidebar" id="conv-sidebar">' +
    '<div class="conv-sidebar-header"><div class="conv-sidebar-title">My conversations</div><div class="conv-sidebar-sub">Direct messages with properties</div></div>' +
    '<div class="conv-list" id="conv-list"><div class="conv-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2h12v9H9l-3 3v-3H2z"/></svg><div>Loading…</div></div></div>' +
  '</div>' +
  '<div class="conv-main" id="conv-main">' +
    '<div class="no-conv-selected" id="no-conv-msg">' +
      '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2 2h12v9H9l-3 3v-3H2z"/></svg>' +
      '<div style="font-family:\'Instrument Serif\',serif;font-size:1.1rem;color:var(--stone);margin-top:8px;">Select a conversation</div>' +
    '</div>' +
  '</div>';

  var guestId = user.id;
  fetch('/api/conversation?guestId=' + encodeURIComponent(guestId))
    .then(function(r){ return r.json(); })
    .then(function(data){
      conversations = data.conversations || [];
      renderSidebar();

      // Auto-open if ?id= in URL
      var urlId = new URLSearchParams(window.location.search).get('id');
      if (urlId) openConversation(urlId);
      else if (conversations.length === 1) openConversation(conversations[0].id);
    })
    .catch(function(e){
      document.getElementById('conv-list').innerHTML = '<div class="conv-empty">Failed to load conversations</div>';
    });
}

function renderSidebar() {
  var list = document.getElementById('conv-list');
  if (!conversations.length) {
    list.innerHTML = '<div class="conv-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2h12v9H9l-3 3v-3H2z"/></svg><div style="margin-top:8px;font-size:.84rem;">No conversations yet</div><div style="margin-top:4px;font-size:.72rem;">Send an enquiry from a property page to start</div></div>';
    return;
  }
  list.innerHTML = conversations.map(function(c) {
    var initial = (c.propertyName || c.propertySlug || '?')[0].toUpperCase();
    var time = c.lastMessageAt ? new Date(c.lastMessageAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
    var hasUnread = c.unreadGuest > 0;
    return '<div class="conv-item' + (c.id === activeConvId ? ' active' : '') + '" onclick="openConversation(\'' + c.id + '\')">' +
      '<div class="conv-avatar">' + initial + '</div>' +
      '<div class="conv-meta">' +
        '<div class="conv-prop">' + (c.propertyName || c.propertySlug) + '</div>' +
        '<div class="conv-preview">' + (c.lastMessagePreview || 'No messages yet') + '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">' +
        '<span class="conv-time">' + time + '</span>' +
        (hasUnread ? '<div class="conv-unread"></div>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function openConversation(id) {
  activeConvId = id;
  renderSidebar();

  // Mark as read
  fetch('/api/conversation', {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({id: id, markReadFor: 'guest'})
  });

  fetch('/api/conversation?id=' + encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(data){
      renderThread(data.conversation, data.messages || []);
      startPolling(id);
    });
}

function renderThread(conv, messages) {
  var main = document.getElementById('conv-main');
  if (!main) return;

  var initial = (conv.propertyName || conv.propertySlug || '?')[0].toUpperCase();
  var enqSummary = '';
  if (conv.enquiry && (conv.enquiry.arrival || conv.enquiry.guests)) {
    var parts = [];
    if (conv.enquiry.cabin) parts.push(conv.enquiry.cabin);
    if (conv.enquiry.guests) parts.push(conv.enquiry.guests);
    if (conv.enquiry.arrival && conv.enquiry.departure) parts.push(conv.enquiry.arrival + ' → ' + conv.enquiry.departure);
    if (parts.length) enqSummary = '<div class="enq-summary">Enquiry: ' + parts.join(' · ') + '</div>';
  }

  var msgsHtml = enqSummary + messages.map(function(m) {
    var role = m.role === 'guest' ? 'guest' : 'property';
    var time = new Date(m.sentAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    return '<div class="msg ' + role + '">' +
      (role === 'property' ? '<div class="msg-sender">' + (m.senderName || conv.propertyName) + '</div>' : '') +
      '<div class="msg-bubble">' + escHtml(m.text) + '</div>' +
      '<div class="msg-meta">' + time + '</div>' +
    '</div>';
  }).join('');

  main.innerHTML =
    '<div class="conv-main-header">' +
      '<button class="back-btn" onclick="showSidebar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg> Back</button>' +
      '<div class="conv-main-avatar">' + initial + '</div>' +
      '<div><div class="conv-main-title">' + (conv.propertyName || conv.propertySlug) + '</div>' +
        '<div class="conv-main-sub">via The Bearing · end-to-end private</div></div>' +
      '<span class="conv-status">' + (conv.status || 'open') + '</span>' +
    '</div>' +
    '<div class="messages-wrap" id="messages-wrap">' + msgsHtml + '</div>' +
    '<div class="conv-input-wrap">' +
      '<textarea class="conv-input" id="conv-msg-input" placeholder="Message ' + (conv.propertyName||'the property') + '…" rows="1" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>' +
      '<button class="conv-send-btn" onclick="sendMessage()" id="conv-send-btn">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' +
      '</button>' +
    '</div>';

  // Scroll to bottom
  setTimeout(function(){
    var wrap = document.getElementById('messages-wrap');
    if(wrap) wrap.scrollTop = wrap.scrollHeight;
  }, 50);
}

function sendMessage() {
  var input = document.getElementById('conv-msg-input');
  var text = (input ? input.value : '').trim();
  if (!text || !activeConvId) return;

  var user = tbAuth.getUser();
  var senderName = user ? ((user.firstName||'') + ' ' + (user.lastName||'')).trim() : 'Guest';

  input.value = '';
  input.style.height = 'auto';

  // Optimistic UI
  var wrap = document.getElementById('messages-wrap');
  if (wrap) {
    var div = document.createElement('div');
    div.className = 'msg guest';
    div.innerHTML = '<div class="msg-bubble">' + escHtml(text) + '</div><div class="msg-meta">Sending…</div>';
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  fetch('/api/conversation', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      action: 'message',
      id: activeConvId,
      role: 'guest',
      text: text,
      senderName: senderName,
      senderEmail: user ? user.emailAddresses[0]?.emailAddress : ''
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(data.ok) refreshMessages();
  })
  .catch(function(e){ console.error('[Channels] Send error:', e); });
}

function refreshMessages() {
  if (!activeConvId) return;
  fetch('/api/conversation?id=' + encodeURIComponent(activeConvId))
    .then(function(r){ return r.json(); })
    .then(function(data){
      // Update just the messages area
      var wrap = document.getElementById('messages-wrap');
      if (!wrap) return;
      var conv = data.conversation;
      var messages = data.messages || [];
      var enqSummary = '';
      if (conv.enquiry && (conv.enquiry.arrival || conv.enquiry.guests)) {
        var parts = [];
        if (conv.enquiry.cabin) parts.push(conv.enquiry.cabin);
        if (conv.enquiry.guests) parts.push(conv.enquiry.guests);
        enqSummary = '<div class="enq-summary">Enquiry: ' + parts.join(' · ') + '</div>';
      }
      wrap.innerHTML = enqSummary + messages.map(function(m) {
        var role = m.role === 'guest' ? 'guest' : 'property';
        var time = new Date(m.sentAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        return '<div class="msg ' + role + '">' +
          (role === 'property' ? '<div class="msg-sender">' + (m.senderName || conv.propertyName) + '</div>' : '') +
          '<div class="msg-bubble">' + escHtml(m.text) + '</div>' +
          '<div class="msg-meta">' + time + '</div>' +
        '</div>';
      }).join('');
      wrap.scrollTop = wrap.scrollHeight;

      // Update sidebar preview
      var conv2 = conversations.find(function(c){ return c.id === activeConvId; });
      if (conv2 && data.conversation) {
        conv2.lastMessagePreview = data.conversation.lastMessagePreview;
        conv2.lastMessageAt = data.conversation.lastMessageAt;
        conv2.unreadGuest = 0;
        renderSidebar();
      }
    });
}

function startPolling(id) {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(function() {
    if (activeConvId === id) refreshMessages();
  }, 5000); // Poll every 5 seconds
}

function showSidebar() {
  document.getElementById('conv-sidebar').classList.add('mobile-show');
  document.getElementById('conv-main').classList.remove('mobile-show');
}

function escHtml(text) {
  return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
</script>

</body>
</html>
