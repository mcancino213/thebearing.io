name = "thebearing-io"
main = "functions/api/envoy.js"
compatibility_date = "2024-09-01"

[assets]
directory = "./"
not_found_handling = "single-page-application"

[observability]
enabled = true

# KV binding for property dossiers (Layer 1/2/3 of Envoy roadmap).
# The id below is filled in automatically by Cloudflare when wrangler
# detects the matching namespace name. If you ever need it explicitly,
# go to dash.cloudflare.com → Storage & Databases → KV → click your
# 'dossiers' namespace → copy the ID.
[[kv_namespaces]]
binding = "DOSSIERS"
id = "aa0c885871474266966e50f0676dd019"

[[vectorize]]
binding = "VECTORIZE"
index_name = "thebearing-properties"

[ai]
binding = "AI"

# Hourly cron — scans conversations for staleness and sends 24h/48h/72h reminders
[triggers]
crons = ["0 * * * *"]

# Clerk webhook secret — set via: wrangler secret put CLERK_WEBHOOK_SECRET
# Resend API key for booking emails — set via: wrangler secret put RESEND_API_KEY
# Get Resend key at: https://resend.com → API Keys
# [vars]
# CLERK_PUBLISHABLE_KEY = "pk_live_..."  # Add to your HTML pages
