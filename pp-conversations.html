<script>
var VIEWER_ROLE = 'partner';
var PP_SLUG = (new URLSearchParams(location.search).get('as') || 'nour-el-nil').trim(); // v73f: ?as=X override for testing as different partners
// v73g: PP_NAME is now derived from the property KV record fetched on load.
// Initially set to the slug as a sane fallback so any code that reads it
// before the fetch resolves doesn't break. fetchPartnerIdentity() at the
// bottom of init updates it and the sidebar header.
var PP_NAME = PP_SLUG;
var ppConvs = [];
var ppActiveId = null;
var ppPoll = null;
var quotedMessage = null;
var lastMsgCount = {};
var soundEnabled = localStorage.getItem('tb_pp_sound') !== 'off';
// v74m: scroll controls (pill + jump button) — installed on open
var ppScrollControls = null;
// v74m: unread count captured at openConv for unread-divider placement
var ppUnreadAtOpen = 0;

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// v73g: pull the partner property record from KV and populate PP_NAME +
// sidebar header. Without this, the page is hardcoded as "Nour El Nil"
// regardless of ?as=X — so a partner viewing as Gypsy would reply with
// "Nour El Nil" attribution and the sidebar would still read "River Cruise · Egypt".
function fetchPartnerIdentity() {
  fetch('/api/property?slug=' + encodeURIComponent(PP_SLUG), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (!d || !d.data) return;
      var p = d.data;
      PP_NAME = p.name || PP_SLUG;
      var nameEl = document.getElementById('sb-context-name');
      if (nameEl) nameEl.textContent = PP_NAME;
      // Role line: "Property type · Country" if we have those; else type alone; else hide
      var roleEl = document.getElementById('sb-context-role');
      if (roleEl) {
        var type = (p.type || '').trim();
        var country = '';
        // Country can live in render.location_line or details.country
        if (p.render && p.render.location_line) {
          // location_line is typically "Aswan, Egypt" — grab the trailing token after comma
          var parts = p.render.location_line.split(',');
          country = (parts[parts.length-1] || '').trim();
        } else if (p.details && p.details.country) {
          country = p.details.country;
        }
        if (type && country)      roleEl.textContent = type + ' · ' + country;
        else if (type)            roleEl.textContent = type;
        else if (country)         roleEl.textContent = country;
        else                      roleEl.textContent = '';
      }
      // Avatar initials from name
      var avEl = document.getElementById('sb-context-avatar');
      if (avEl && PP_NAME) {
        avEl.textContent = PP_NAME.split(/\s+/).map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2);
      }
    })
    .catch(function(e){ console.warn('[pp-conversations] partner identity fetch failed:', e); });
}
function fmt(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function fmtDaySep(date) {
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(date); d.setHours(0,0,0,0);
  var diff = (today - d) / 86400000;
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return date.toLocaleDateString('en-US', {weekday:'long'});
  return date.toLocaleDateString('en-US', {month:'short', day:'numeric', year: date.getFullYear() === today.getFullYear() ? undefined : 'numeric'});
}

function avatarInitials(role, name) {
  if (role === 'admin') return 'B';
  if (!name) return '?';
  if (role === 'partner') return name.charAt(0).toUpperCase();
  return name.charAt(0).toUpperCase();
}
function makeAvatar(role, name, imageUrl) {
  var wrap = document.createElement('span');
  wrap.className = 'msg-sender-avatar role-' + role;
  if (imageUrl) {
    var img = document.createElement('img');
    img.src = imageUrl;
    img.onerror = function() { wrap.textContent = avatarInitials(role, name); };
    wrap.appendChild(img);
  } else {
    wrap.textContent = avatarInitials(role, name);
  }
  return wrap;
}

function loadConvs() {
  fetch('/api/conversation?slug=' + PP_SLUG)
    .then(function(r) { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d) {
      ppConvs = (d.conversations || []).filter(function(c){ return c.status !== 'archived'; });
      var countEl = document.getElementById('conv-list-count');
      if (countEl) {
        var unread = ppConvs.filter(function(c){ return (c.unreadAdmin || 0) > 0; }).length;
        countEl.textContent = ppConvs.length + ' conversation' + (ppConvs.length === 1 ? '' : 's') + (unread > 0 ? ' · ' + unread + ' unread' : '');
      }
      renderConvList();
      ppUpdateUnreadIndicator();
      // v73am: auto-open the conversation specified in ?id= URL param after
      // the list loads. Used when partner clicks a link from a notification
      // email. Only fires once per page load (window._ppAutoOpened guard).
      // If the requested id isn't in the visible list (e.g. wrong ?as= slug),
      // log a warning so it's debuggable.
      if (!window._ppAutoOpened) {
        var urlId = new URLSearchParams(location.search).get('id');
        if (urlId) {
          window._ppAutoOpened = true;
          var match = ppConvs.find(function(c) { return c.id === urlId; });
          if (match) {
            openConv(urlId);
          } else {
            console.warn('[pp-conversations] requested conv ' + urlId + ' not in this partner\'s list (slug=' + PP_SLUG + '). Check that ?as=X matches the conversation\'s property.');
          }
        }
      }
    })
    .catch(function(e) {
      document.getElementById('pp-conv-list').innerHTML = '<div class="conv-loading" style="color:var(--red);">Error: ' + escHtml(e.message) + '</div>';
    });
}

function renderConvList() {
  var el = document.getElementById('pp-conv-list');
  if (!ppConvs.length) {
    el.innerHTML = '<div class="conv-empty"><div style="margin-bottom:8px;font-weight:500;color:var(--text2);">No conversations yet</div><div>Conversations from enquiries will appear here.</div></div>';
    return;
  }
  // Group by time bucket
  var startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
  var startOfYesterday = new Date(startOfToday); startOfYesterday.setDate(startOfYesterday.getDate() - 1);
  var startOfWeek = new Date(startOfToday); startOfWeek.setDate(startOfWeek.getDate() - 7);

  var groups = { Today: [], Yesterday: [], 'This week': [], Older: [] };
  var sorted = ppConvs.slice().sort(function(a, b) {
    return new Date(b.lastMessageAt || 0) - new Date(a.lastMessageAt || 0);
  });
  sorted.forEach(function(c) {
    var t = new Date(c.lastMessageAt || 0).getTime();
    if (t >= startOfToday.getTime()) groups.Today.push(c);
    else if (t >= startOfYesterday.getTime()) groups.Yesterday.push(c);
    else if (t >= startOfWeek.getTime()) groups['This week'].push(c);
    else groups.Older.push(c);
  });

  el.innerHTML = '';
  ['Today', 'Yesterday', 'This week', 'Older'].forEach(function(label) {
    var bucket = groups[label];
    if (!bucket.length) return;
    var lbl = document.createElement('div');
    lbl.className = 'conv-group-label';
    lbl.textContent = label + ' · ' + bucket.length;
    el.appendChild(lbl);
    bucket.forEach(function(c) { el.appendChild(buildConvItem(c)); });
  });
}

function buildConvItem(c) {
  // v74o: privacy — never derive initials or display name from the
  // guest's email on the partner side. If we don't have a guestName
  // on record, show "?" as the avatar and "Guest" as the display name.
  var initials = (c.guestName || '?').split(/\s+/).map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase();
  var hasUnread = (c.unreadAdmin || 0) > 0;
  var item = document.createElement('div');
  item.className = 'conv-item' + (c.id === ppActiveId ? ' active' : '') + (hasUnread ? ' unread' : '');
  item.setAttribute('data-id', c.id);
  item.addEventListener('click', function() { openConv(c.id); });

  var avatar = document.createElement('div');
  avatar.className = 'conv-avatar';
  if (c.guestAvatar) {
    avatar.style.background = 'none';
    avatar.innerHTML = '<img src="' + escHtml(c.guestAvatar) + '">';
  } else {
    avatar.textContent = initials || '?';
  }

  var meta = document.createElement('div');
  meta.className = 'conv-meta';
  var line1 = document.createElement('div');
  line1.className = 'conv-line1';
  var nameEl = document.createElement('div');
  nameEl.className = 'conv-guest-name';
  // v74o: no email fallback. Use generic "Guest" if no name on record.
  nameEl.textContent = c.guestName || 'Guest';
  var timeEl = document.createElement('span');
  timeEl.className = 'conv-time';
  timeEl.textContent = fmt(c.lastMessageAt);
  line1.appendChild(nameEl);
  line1.appendChild(timeEl);

  var sub = document.createElement('div');
  sub.className = 'conv-prop-name';
  sub.textContent = (c.enquiry && c.enquiry.cabin) || '';

  var preview = document.createElement('div');
  preview.className = 'conv-preview';
  preview.textContent = c.lastMessagePreview || '';

  meta.appendChild(line1);
  if (sub.textContent) meta.appendChild(sub);
  meta.appendChild(preview);

  if (hasUnread || (c.loopSummary && c.loopSummary.active)) {
    var pills = document.createElement('div');
    pills.className = 'conv-pills';
    if (hasUnread) {
      var unreadPill = document.createElement('span');
      unreadPill.className = 'conv-pill unread';
      unreadPill.textContent = c.unreadAdmin + ' unread';
      pills.appendChild(unreadPill);
    }
    // v74c: partner-side loop indicator — uses unreadPartner (admin's reply
    // is what partner cares about). 🔒 N when partner has admin-unread,
    // 🔒 (no number) when loop is active but partner has nothing new from admin.
    if (c.loopSummary && c.loopSummary.active) {
      var loopPill = document.createElement('span');
      loopPill.className = 'conv-pill loop-pill';
      var n = c.loopSummary.unreadPartner || 0;
      loopPill.textContent = n > 0 ? '\uD83D\uDD12 ' + n : '\uD83D\uDD12';
      pills.appendChild(loopPill);
    }
    meta.appendChild(pills);
  }

  item.appendChild(avatar);
  item.appendChild(meta);
  return item;
}

function openConv(id) {
  ppActiveId = id;
  // v74a: stop any previous loop polling — will restart inside renderLoopPane
  if (ppLoopPoll) { clearInterval(ppLoopPoll); ppLoopPoll = null; }
  ppLoopState = { loop: null, messages: [] };
  renderConvList();
  // v74m: capture unread count BEFORE marking read so renderer can place
  // the unread-divider. NB: partner's unread count lives on conv.unreadAdmin
  // (legacy field naming — "admin" here means "messages from the admin/guest
  // side", i.e. unread for the partner).
  var prevConv = ppConvs.find(function(c){ return c.id === id; });
  ppUnreadAtOpen = prevConv ? (prevConv.unreadAdmin || 0) : 0;
  // v74m: tear down previous conversation's scroll controls
  if (ppScrollControls && typeof ppScrollControls.destroy === 'function') {
    ppScrollControls.destroy();
    ppScrollControls = null;
  }
  fetch('/api/conversation', {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,markReadFor:'admin'})});
  var conv = ppConvs.find(function(c){ return c.id === id; });
  if (conv) conv.unreadAdmin = 0;

  fetch('/api/conversation?id=' + encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var convData = d.conversation;
      // Fetch guest avatar from members
      if (convData && convData.guestId && convData.guestId.indexOf('user_') === 0) {
        fetch('/api/members?id=' + encodeURIComponent(convData.guestId))
          .then(function(r){ return r.json(); })
          .then(function(md){
            if (md && md.data && md.data.avatar) convData.guestAvatar = md.data.avatar;
            renderThread(convData, d.messages || []);
            startPoll(id);
          })
          .catch(function(){ renderThread(convData, d.messages || []); startPoll(id); });
      } else {
        renderThread(convData, d.messages || []);
        startPoll(id);
      }
    });
}

function renderThread(conv, messages) {
  var thread = document.getElementById('pp-conv-thread');
  thread.innerHTML = '';

  // ── Header ──
  var hdr = document.createElement('div');
  hdr.className = 'thread-header';

  // v74o: privacy — don't derive initials from email when name is missing
  var initials = (conv.guestName || '?').split(/\s+/).map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase();
  var avatar = document.createElement('div');
  avatar.className = 'thread-header-avatar';
  if (conv.guestAvatar) {
    avatar.style.background = 'none';
    avatar.innerHTML = '<img src="' + escHtml(conv.guestAvatar) + '">';
  } else {
    avatar.textContent = initials;
  }

  var info = document.createElement('div');
  info.className = 'thread-header-info';
  var title = document.createElement('div');
  title.className = 'thread-title';
  // v74o: privacy — never show the guest's email on the partner side.
  // The whole point of TheBearing-in-the-middle is that the partner
  // can't communicate with the guest outside the platform. If we have
  // no name on record, show a generic "Guest" rather than leaking the
  // email as a fallback.
  title.textContent = conv.guestName || 'Guest';
  var sub = document.createElement('div');
  sub.className = 'thread-sub';
  sub.id = 'pp-presence-line';
  // v74o: subline previously led with the guest's email — replaced with
  // the enquiry cabin (which is what the partner needs to know to
  // service the conversation). Presence ("Online" / "Last seen X") is
  // appended below.
  sub.innerHTML = (conv.enquiry && conv.enquiry.cabin
    ? '<span>' + escHtml(conv.enquiry.cabin) + '</span>'
    : '');
  info.appendChild(title);
  info.appendChild(sub);

  if (window.ConvPresence && conv.guestId) {
    window.ConvPresence.fetchPresence({ guestId: conv.guestId }).then(function(p) {
      var line = document.getElementById('pp-presence-line');
      if (!line) return;
      // v74o: when the sub was previously empty (no cabin), prepend a
      // bare status span without the leading bullet separator.
      var isEmpty = !line.innerHTML.trim();
      var sep = isEmpty ? '' : '<span class="thread-sub-sep">·</span>';
      var status = '';
      if (p.guestOnline) status = sep + '<span style="color:#10b981;font-weight:600;display:inline-flex;align-items:center;gap:5px;"><span class="online-dot"></span>Online</span>';
      else if (p.guestLastSeen) status = sep + '<span>Last seen ' + escHtml(window.ConvPresence.timeAgo(p.guestLastSeen)) + '</span>';
      if (status) line.innerHTML = line.innerHTML + status;
    }).catch(function(){});
  }

  // v74p: Actions cluster — icon-only bell (per-conv mute) + gear (per-event
  // prefs). Previously a verbose ~200px pill saying "Email notifications [On/Off]"
  // — too prominent for a per-conversation control. Now a square 32×32
  // button showing a bell (on) or bell-with-slash (off). Tooltip describes
  // the state and the action. Same compact footprint as the gear next to it.
  var actions = document.createElement('div');
  actions.className = 'thread-header-actions';

  var notifyOn = (conv.notifyPartner !== false);
  var notifyBtn = document.createElement('button');
  notifyBtn.type = 'button';
  notifyBtn.style.cssText = 'display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--border);background:#f9fafb;border-radius:8px;cursor:pointer;padding:0;transition:background .15s,border-color .15s,color .15s;';
  function paintNotifyBtn() {
    var envelopeOn = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>';
    var envelopeOff = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
    notifyBtn.innerHTML = notifyOn ? envelopeOn : envelopeOff;
    notifyBtn.style.color = notifyOn ? '#475569' : '#94a3b8';
    notifyBtn.title = notifyOn
      ? 'Email notifications on for this conversation — click to mute'
      : 'Email notifications muted for this conversation — click to unmute';
    notifyBtn.setAttribute('aria-label', notifyBtn.title);
    notifyBtn.setAttribute('aria-pressed', notifyOn ? 'true' : 'false');
  }
  paintNotifyBtn();
  notifyBtn.onmouseover = function(){ notifyBtn.style.background = '#f1f5f9'; };
  notifyBtn.onmouseout = function(){ notifyBtn.style.background = '#f9fafb'; };
  notifyBtn.onclick = async function() {
    notifyBtn.disabled = true;
    try {
      var r = await fetch('/api/notify-toggle', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ id: conv.id, role: 'partner', enabled: !notifyOn })
      });
      var d = await r.json();
      if (d.ok) {
        notifyOn = d.notifyPartner;
        conv.notifyPartner = notifyOn;
        paintNotifyBtn();
      }
    } catch(e) {}
    notifyBtn.disabled = false;
  };
  actions.appendChild(notifyBtn);

  // v74p: gear button — was previously a sun-shaped SVG (circle with rays
  // in 8 cardinal/diagonal directions). Replaced with an actual gear/cog
  // shape so it visually reads as "settings", matching its purpose
  // (per-event notification preferences for this conversation).
  // Settings stored on conv.notifyPartnerEvents (per-key, true/false).
  // Submitted via POST /api/partner-notif with { slug, convId, eventMute }.
  var gearBtn = document.createElement('button');
  gearBtn.type = 'button';
  gearBtn.title = 'Per-event preferences for this conversation';
  gearBtn.setAttribute('aria-label', 'Per-event notification preferences for this conversation');
  gearBtn.style.cssText = 'display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--border);background:#f9fafb;border-radius:8px;cursor:pointer;padding:0;color:#475569;transition:background .15s,border-color .15s;';
  gearBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
  gearBtn.onmouseover = function(){ gearBtn.style.background = '#f1f5f9'; };
  gearBtn.onmouseout = function(){ gearBtn.style.background = '#f9fafb'; };

  var PARTNER_EVENT_DEFS = [
    { key: 'new_enquiry',    label: 'New enquiry' },
    { key: 'guest_reply',    label: 'Guest reply' },
    { key: 'deposit_paid',   label: 'Deposit paid' },
    { key: 'offer_declined', label: 'Offer declined' },
    { key: 'change_request', label: 'Change request' },
    { key: 'stale_reminder', label: 'Stale reminders' }
  ];

  function openEventPopover() {
    // Close any existing popover first
    var existing = document.getElementById('pp-event-popover');
    if (existing) { existing.remove(); return; }

    var pop = document.createElement('div');
    pop.id = 'pp-event-popover';
    pop.style.cssText = 'position:absolute;top:calc(100% + 6px);right:0;width:280px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:14px;z-index:50;font-size:.78rem;';
    var title = document.createElement('div');
    title.textContent = 'Mute specific events for this conversation';
    title.style.cssText = 'font-weight:600;color:var(--text);margin-bottom:4px;font-size:.78rem;';
    var sub = document.createElement('div');
    sub.textContent = 'Overrides the property-wide setting. Affects only this conversation.';
    sub.style.cssText = 'color:var(--text2);font-size:.7rem;margin-bottom:12px;line-height:1.4;';
    pop.appendChild(title);
    pop.appendChild(sub);

    var convEvents = conv.notifyPartnerEvents || {};
    PARTNER_EVENT_DEFS.forEach(function(ev, idx) {
      var row = document.createElement('label');
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;cursor:pointer;'
        + (idx < PARTNER_EVENT_DEFS.length - 1 ? 'border-bottom:1px solid #f1f5f9;' : '');
      var lbl = document.createElement('span');
      lbl.textContent = ev.label;
      lbl.style.cssText = 'color:var(--text);';
      var isEnabled = convEvents[ev.key] !== false; // default true
      var sw = document.createElement('input');
      sw.type = 'checkbox';
      sw.checked = isEnabled;
      sw.style.cssText = 'width:16px;height:16px;cursor:pointer;accent-color:#c17f3e;';
      sw.onchange = function() {
        convEvents[ev.key] = sw.checked;
        // POST update
        fetch('/api/partner-notif', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slug: conv.propertySlug,
            convId: conv.id,
            eventMute: (function(){ var o={}; o[ev.key] = sw.checked; return o; })()
          })
        }).then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){
            if (d && d.notifyPartnerEvents) conv.notifyPartnerEvents = d.notifyPartnerEvents;
          })
          .catch(function(){ sw.checked = !sw.checked; });
      };
      row.appendChild(lbl);
      row.appendChild(sw);
      pop.appendChild(row);
    });

    // Position popover relative to the actions container
    actions.style.position = 'relative';
    actions.appendChild(pop);

    // Close on outside click
    setTimeout(function() {
      function outside(e) {
        if (!pop.contains(e.target) && e.target !== gearBtn) {
          pop.remove();
          document.removeEventListener('click', outside);
        }
      }
      document.addEventListener('click', outside);
    }, 0);
  }
  gearBtn.onclick = function(e) {
    e.stopPropagation();
    openEventPopover();
  };
  actions.appendChild(gearBtn);

  hdr.appendChild(avatar);
  hdr.appendChild(info);
  hdr.appendChild(actions);
  thread.appendChild(hdr);

  // v73o: archived banner — same as customer-side. Partner can no longer
  // reply once the enquiry is cancelled. The banner explains; the composer
  // gets replaced with a notice strip.
  var isArchived = conv.status === 'archived';
  if (isArchived) {
    thread.classList.add('thread-archived');
    var archBanner = document.createElement('div');
    archBanner.className = 'archived-banner';
    var reason = '';
    if (conv.archivedReason === 'enquiry_cancelled_by_guest') reason = 'The guest cancelled this enquiry.';
    else if (conv.archivedReason === 'enquiry_cancelled_by_admin' || conv.archivedReason === 'enquiry_cancelled_admin_batch') reason = 'This enquiry was cancelled.';
    else reason = 'This conversation is archived.';
    var when = conv.archivedAt ? new Date(conv.archivedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
    archBanner.innerHTML =
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 6 L3 4 a1 1 0 0 1 1 -1 L20 3 a1 1 0 0 1 1 1 L21 6"/><line x1="10" y1="12" x2="14" y2="12"/></svg>' +
      '<div>' +
        '<div class="archived-title">Read-only \u2014 ' + escHtml(reason) + (when ? ' <span class="archived-when">' + escHtml(when) + '</span>' : '') + '</div>' +
        '<div class="archived-sub">Replies are no longer accepted. History is preserved.</div>' +
      '</div>';
    thread.appendChild(archBanner);
  }

  // ── Messages ──
  var wrap = document.createElement('div');
  wrap.className = 'messages-wrap';
  wrap.id = 'pp-msgs-wrap';
  renderMessagesInto(wrap, conv, messages);
  thread.appendChild(wrap);

  // ── Composer ──
  if (isArchived) {
    var notice = document.createElement('div');
    notice.className = 'archived-composer-notice';
    notice.innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
      '<span>This conversation is closed.</span>';
    thread.appendChild(notice);
    quotedMessage = null;
    renderContextPanel(conv);
    ppFinalizeOpenScroll(wrap);
    return;
  }

  var replyWrap = document.createElement('div');
  replyWrap.className = 'reply-wrap';
  var container = document.createElement('div');
  container.className = 'reply-container';
  var textarea = document.createElement('textarea');
  textarea.className = 'reply-input';
  textarea.id = 'pp-reply-input';
  textarea.rows = 2;
  textarea.placeholder = 'Reply to ' + (conv.guestName || 'guest') + '\u2026';
  textarea.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      sendReply();
    }
  });
  textarea.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  });

  var toolbar = document.createElement('div');
  toolbar.className = 'reply-toolbar';
  var spacer = document.createElement('div');
  spacer.className = 'reply-toolbar-spacer';
  var hint = document.createElement('span');
  hint.className = 'reply-hint';
  hint.innerHTML = '<kbd>⌘</kbd> <kbd>↵</kbd> to send';
  var sendBtn = document.createElement('button');
  sendBtn.className = 'reply-btn';
  sendBtn.innerHTML = 'Send <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
  sendBtn.addEventListener('click', sendReply);

  toolbar.appendChild(spacer);
  toolbar.appendChild(hint);
  toolbar.appendChild(sendBtn);
  container.appendChild(textarea);
  container.appendChild(toolbar);
  replyWrap.appendChild(container);
  thread.appendChild(replyWrap);

  quotedMessage = null;
  renderContextPanel(conv);

  ppFinalizeOpenScroll(wrap);
}

// v74m: post-render scroll + control install for a freshly-opened
// partner conversation. Mirrors chFinalizeOpenScroll (customer) and
// adminFinalizeOpenScroll (admin). Three behaviours:
//   1. If unread-divider exists in the DOM, scroll it into view.
//   2. Otherwise pinToBottom (default).
//   3. Install ConvScroll for the pill + jump button.
//   4. Reset ppUnreadAtOpen so polling refreshes don't re-insert the
//      divider.
function ppFinalizeOpenScroll(wrap) {
  // v74p: install scroll controls FIRST — see chFinalizeOpenScroll comment.
  if (window.ConvScroll && typeof window.ConvScroll.install === 'function') {
    ppScrollControls = window.ConvScroll.install(wrap, { threshold: 200 });
  }
  var divider = document.getElementById('pp-unread-divider');
  if (divider) {
    requestAnimationFrame(function() {
      divider.scrollIntoView({ block: 'center', behavior: 'auto' });
    });
  } else {
    window.pinToBottom(wrap);
  }
  ppUnreadAtOpen = 0;
}

function renderMessagesInto(wrap, conv, messages) {
  wrap.innerHTML = '';

  if (conv.enquiry) {
    var parts = [];
    if (conv.enquiry.cabin) parts.push(conv.enquiry.cabin);
    if (conv.enquiry.guests) parts.push(conv.enquiry.guests + ' guests');
    if (conv.enquiry.arrival) parts.push(conv.enquiry.arrival + (conv.enquiry.departure ? ' → ' + conv.enquiry.departure : ''));
    if (parts.length) {
      var pill = document.createElement('div');
      pill.className = 'enq-pill';
      var pillLabel = document.createElement('div');
      pillLabel.className = 'enq-pill-label';
      pillLabel.textContent = 'Enquiry details';
      var pillContent = document.createElement('div');
      pillContent.className = 'enq-pill-content';
      pillContent.textContent = parts.join(' · ');
      pill.appendChild(pillLabel);
      pill.appendChild(pillContent);
      wrap.appendChild(pill);
    }
  }

  var lastDay = '';
  // v74m: compute index where the unread-divider goes (before the first
  // unread message). ppUnreadAtOpen is captured in openConv() before the
  // mark-read PATCH; reset to 0 in ppFinalizeOpenScroll once used so
  // polling refreshes don't re-insert.
  var unreadDividerIdx = (ppUnreadAtOpen > 0 && messages.length >= ppUnreadAtOpen)
    ? (messages.length - ppUnreadAtOpen)
    : -1;
  messages.forEach(function(m, idx) {
    // v74m: insert divider before the first unread message
    if (idx === unreadDividerIdx) {
      var divider = document.createElement('div');
      divider.className = 'unread-divider';
      divider.id = 'pp-unread-divider';
      var lbl = document.createElement('span');
      lbl.className = 'unread-divider-label';
      lbl.textContent = ppUnreadAtOpen === 1 ? 'New message' : 'New messages';
      divider.appendChild(lbl);
      wrap.appendChild(divider);
    }
    var role = m.role === 'guest' ? 'guest' : (m.role === 'partner' ? 'partner' : 'admin');
    var side = role === VIEWER_ROLE ? 'from-self' : 'from-other';
    var sentAt = new Date(m.sentAt);
    var dayKey = sentAt.toDateString();
    if (dayKey !== lastDay) {
      var sep = document.createElement('div');
      sep.className = 'msg-day-sep';
      sep.textContent = fmtDaySep(sentAt);
      wrap.appendChild(sep);
      lastDay = dayKey;
    }

    var prev = messages[idx - 1];
    var next = messages[idx + 1];
    var prevSame = prev && prev.role === m.role && (sentAt - new Date(prev.sentAt)) < 5 * 60 * 1000 && new Date(prev.sentAt).toDateString() === dayKey;
    var nextSame = next && next.role === m.role && (new Date(next.sentAt) - sentAt) < 5 * 60 * 1000 && new Date(next.sentAt).toDateString() === dayKey;
    var groupClass = '';
    if (prevSame && nextSame) groupClass = ' group-mid';
    else if (prevSame && !nextSame) groupClass = ' group-end';
    else groupClass = ' group-start';

    var msgEl = document.createElement('div');
    msgEl.className = 'msg ' + side + ' role-' + role + groupClass;

    var senderText = m.senderName ||
      (role === 'guest' ? (conv.guestName || 'Guest')
      : role === 'partner' ? PP_NAME
      : 'The Bearing');

    if (!prevSame) {
      var sender = document.createElement('div');
      sender.className = 'msg-sender';
      var avatarImg = null;
      if (role === 'guest' && conv.guestAvatar) avatarImg = conv.guestAvatar;
      var av = makeAvatar(role, senderText, avatarImg);
      var nameSpan = document.createElement('span');
      nameSpan.textContent = senderText;
      sender.appendChild(av);
      sender.appendChild(nameSpan);
      if (role === 'admin') {
        var rl = document.createElement('span');
        rl.className = 'msg-sender-role';
        rl.textContent = 'Bearing';
        sender.appendChild(rl);
      } else if (role === 'partner') {
        var rl = document.createElement('span');
        rl.className = 'msg-sender-role';
        rl.textContent = 'You';
        sender.appendChild(rl);
      }
      msgEl.appendChild(sender);
    }

    var bubble = document.createElement('div');
    // v73ad: parity with customer + admin \u2014 render structured cards for
    // offer_card and booking_confirmed types.
    if (m.type === 'offer_card' && m.offerSummary) {
      bubble.className = 'msg-bubble offer-card';
      var s = m.offerSummary;
      var dateStr = '';
      if (s.arrival && s.departure) {
        var fmt = function(iso) {
          try { return new Date(iso).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); }
          catch(_) { return iso; }
        };
        dateStr = fmt(s.arrival) + ' \u2192 ' + fmt(s.departure) + (s.nights ? ' \u00b7 ' + s.nights + ' night' + (s.nights > 1 ? 's' : '') : '');
      }
      var totalStr = s.total_amount ? '$' + Number(s.total_amount).toLocaleString() : '\u2014';
      var depositStr = s.deposit_amount ? '$' + Number(s.deposit_amount).toLocaleString() : '\u2014';
      var validStr = '';
      if (s.valid_until) {
        try {
          var daysLeft = Math.ceil((new Date(s.valid_until) - new Date()) / (24*60*60*1000));
          if (daysLeft > 0) validStr = 'Valid for ' + daysLeft + ' more day' + (daysLeft === 1 ? '' : 's');
          else validStr = 'Expired';
        } catch(_) {}
      }
      function escH(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      bubble.innerHTML =
        '<div class="offer-card-eyebrow">\ud83d\udccb  Offer sent to guest</div>' +
        '<div class="offer-card-title">' + escH(s.propertyName || 'Property') + '</div>' +
        (s.room ? '<div class="offer-card-sub">' + escH(s.room) + (s.guests ? ' \u00b7 ' + escH(String(s.guests)) + ' guest' + (s.guests > 1 ? 's' : '') : '') + '</div>' : '') +
        (dateStr ? '<div class="offer-card-dates">' + escH(dateStr) + '</div>' : '') +
        '<div class="offer-card-pricing">' +
          '<div><div class="lbl">Total</div><div class="val">' + totalStr + '</div></div>' +
          '<div><div class="lbl">Deposit</div><div class="val">' + depositStr + '</div></div>' +
        '</div>' +
        (validStr ? '<div class="offer-card-valid">' + escH(validStr) + '</div>' : '') +
        '<button class="offer-card-cta" type="button" data-offer-id="' + escH(m.offerId || '') + '">View offer \u2192</button>';
      var ctaBtn = bubble.querySelector('.offer-card-cta');
      if (ctaBtn) {
        ctaBtn.addEventListener('click', function() {
          if (window.TBOfferDetail) window.TBOfferDetail.open(m.offerId, { mode: 'partner' });
        });
      }
    } else if (m.type === 'booking_confirmed') {
      bubble.className = 'msg-bubble booking-confirmed-card';
      function escH2(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      bubble.innerHTML =
        '<div class="bc-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<div class="bc-body">' +
          '<div class="bc-title">Booking confirmed</div>' +
          '<div class="bc-text">' + escH2(m.text || '').replace(/\n/g, '<br>') + '</div>' +
          (m.bookingRef ? '<a href="pp-bookings.html" class="bc-cta">View in bookings \u2192</a>' : '') +
        '</div>';
    } else if (m.type === 'offer_declined') {
      // v73at: muted/somber card for guest-declined offers. Parity with
      // customer + admin. Worker text format: "Guest declined the offer.
      // Reason: ..." — split on " Reason: " to quote the reason separately.
      bubble.className = 'msg-bubble offer-declined-card';
      function escH3(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      var odFullTextP = m.text || '';
      var odMainTextP = odFullTextP;
      var odReasonP = '';
      var odReasonIdxP = odFullTextP.indexOf(' Reason: ');
      if (odReasonIdxP >= 0) {
        odMainTextP = odFullTextP.slice(0, odReasonIdxP);
        odReasonP = odFullTextP.slice(odReasonIdxP + ' Reason: '.length);
      }
      bubble.innerHTML =
        '<div class="od-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17l-5-5 5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg></div>' +
        '<div class="od-body">' +
          '<div class="od-title">Offer declined</div>' +
          '<div class="od-text">' + escH3(odMainTextP) + '</div>' +
          (odReasonP ? '<div class="od-reason">\u201C' + escH3(odReasonP) + '\u201D</div>' : '') +
        '</div>';
    } else if (m.type === 'amendment_card' && m.amendmentSummary) {
      // v74e: partner-side amendment_card — read-only (partner is the one
      // who SENT this; they can't approve/decline their own amendment).
      // Visually identical to admin's read-only treatment but with "You
      // proposed this change" framing.
      bubble.className = 'msg-bubble amendment-card';
      function escHp(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      var amSp = m.amendmentSummary;
      var amPrevP = amSp.previous_state || {};
      var amFmtP = function(iso) {
        try { return new Date(iso).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); }
        catch(_) { return iso; }
      };
      var amMoneyP = function(n) { return '$' + (Number(n) || 0).toLocaleString(); };
      var amRowsP = [];
      if ((amPrevP.room || '') !== (amSp.room || '')) {
        amRowsP.push({ lbl: 'Room', from: amPrevP.room || '\u2014', to: amSp.room || '\u2014' });
      }
      if (amPrevP.arrival !== amSp.arrival || amPrevP.departure !== amSp.departure) {
        amRowsP.push({
          lbl: 'Dates',
          from: amPrevP.arrival ? (amFmtP(amPrevP.arrival) + ' \u2192 ' + amFmtP(amPrevP.departure)) : '\u2014',
          to: amFmtP(amSp.arrival) + ' \u2192 ' + amFmtP(amSp.departure)
        });
      }
      if ((amPrevP.guests || 0) !== (amSp.guests || 0)) {
        amRowsP.push({ lbl: 'Guests', from: String(amPrevP.guests || ''), to: String(amSp.guests || '') });
      }
      if ((amPrevP.total_amount || 0) !== (amSp.total_amount || 0)) {
        amRowsP.push({ lbl: 'Total', from: amMoneyP(amPrevP.total_amount), to: amMoneyP(amSp.total_amount) });
      }
      var amDiffHtmlP = amRowsP.map(function(r) {
        return '<div class="am-row">' +
          '<div class="am-row-lbl">' + escHp(r.lbl) + '</div>' +
          '<div class="am-row-from">' + escHp(r.from) + '</div>' +
          '<div class="am-row-arrow">\u2192</div>' +
          '<div class="am-row-to">' + escHp(r.to) + '</div>' +
        '</div>';
      }).join('');
      var amDeltaP = amSp.delta_total || 0;
      var amDeltaDepP = amSp.delta_deposit || 0;
      var amDeltaHtmlP = amDeltaP > 0
        ? '<div class="am-delta"><strong>+' + amMoneyP(amDeltaP) + ' total</strong> \u00b7 deposit delta: <strong>' + amMoneyP(amDeltaDepP) + '</strong></div>'
        : '<div class="am-delta am-delta-neutral">No price change.</div>';
      var amNoteHtmlP = m.partner_note
        ? '<div class="am-note">\u201C' + escHp(m.partner_note) + '\u201D <span class="am-note-attr">\u2014 you</span></div>'
        : '';
      bubble.innerHTML =
        '<div class="am-eyebrow">\u270e You proposed a change</div>' +
        '<div class="am-title">' + escHp(amSp.propertyName || 'Property') + '</div>' +
        '<div class="am-diff">' + amDiffHtmlP + '</div>' +
        amDeltaHtmlP +
        amNoteHtmlP +
        '<div class="am-readonly-note">Waiting on the guest to approve or decline. You\u2019ll be notified when they act.</div>';
    } else if (m.type === 'amendment_accepted') {
      bubble.className = 'msg-bubble amendment-accepted-card';
      function escHpa(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      bubble.innerHTML =
        '<div class="aa-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<div class="aa-body">' +
          '<div class="aa-title">Booking updated</div>' +
          '<div class="aa-text">' + escHpa(m.text || 'The guest approved your proposed change.') + '</div>' +
        '</div>';
    } else if (m.type === 'amendment_declined') {
      bubble.className = 'msg-bubble amendment-declined-card';
      function escHpd(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      bubble.innerHTML =
        '<div class="ad-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17l-5-5 5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg></div>' +
        '<div class="ad-body">' +
          '<div class="ad-title">Change declined</div>' +
          '<div class="ad-text">' + escHpd(m.text || 'The guest declined the proposed change. The original booking stands.') + '</div>' +
        '</div>';
    } else {
      bubble.className = 'msg-bubble';
      bubble.textContent = m.text;
    }
    if (m.source === 'email') {
      var srcBadge = document.createElement('span');
      srcBadge.className = 'msg-source-badge';
      srcBadge.textContent = 'via email';
      bubble.appendChild(srcBadge);
    }

    // Hover actions \u2014 skipped for card-type system messages (parity with
    // customer + admin).
    if (m.type !== 'offer_card' && m.type !== 'booking_confirmed' && m.type !== 'offer_declined' && m.type !== 'amendment_card' && m.type !== 'amendment_accepted' && m.type !== 'amendment_declined') {
    var mActions = document.createElement('div');
    mActions.className = 'msg-actions';
    var capturedText = m.text;
    var capturedSender = m.senderName || senderText || 'Guest';
    var capturedMsgId = m.id;

    var emojiWrap = document.createElement('div');
    emojiWrap.className = 'msg-action-emoji-picker';
    var emojiBtn = document.createElement('button');
    emojiBtn.className = 'msg-action-btn';
    emojiBtn.title = 'Add reaction';
    emojiBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>';
    var emojiPop = document.createElement('div');
    emojiPop.className = 'msg-emoji-popover';
    ['👍','❤️','🎉','✨','🙏','🔥'].forEach(function(emoji) {
      var btn = document.createElement('button');
      btn.className = 'msg-emoji-btn';
      btn.textContent = emoji;
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleReaction(capturedMsgId, emoji);
        emojiWrap.classList.remove('open');
        mActions.classList.remove('actions-pinned');
      });
      emojiPop.appendChild(btn);
    });
    emojiBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      document.querySelectorAll('.msg-action-emoji-picker.open').forEach(function(el) {
        if (el !== emojiWrap) {
          el.classList.remove('open');
          var pa = el.closest('.msg-actions'); if (pa) pa.classList.remove('actions-pinned');
        }
      });
      emojiWrap.classList.toggle('open');
      mActions.classList.toggle('actions-pinned', emojiWrap.classList.contains('open'));
    });
    emojiWrap.appendChild(emojiBtn);
    emojiWrap.appendChild(emojiPop);

    var quoteBtn = document.createElement('button');
    quoteBtn.className = 'msg-action-btn';
    quoteBtn.title = 'Reply with quote';
    quoteBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>';
    quoteBtn.addEventListener('click', function() { quoteMessage(capturedSender, capturedText); });

    var copyBtn = document.createElement('button');
    copyBtn.className = 'msg-action-btn';
    copyBtn.title = 'Copy message text';
    copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    copyBtn.addEventListener('click', function() { copyToClipboard(capturedText); });

    mActions.appendChild(emojiWrap);
    mActions.appendChild(quoteBtn);
    mActions.appendChild(copyBtn);
    bubble.appendChild(mActions);
    } // end if (m.type !== 'offer_card' && 'booking_confirmed')
    msgEl.appendChild(bubble);

    // Reactions
    if (m.reactions && Object.keys(m.reactions).length) {
      var rxWrap = document.createElement('div');
      rxWrap.className = 'msg-reactions';
      Object.keys(m.reactions).forEach(function(emoji) {
        var users = m.reactions[emoji];
        if (!users || !users.length) return;
        var pill = document.createElement('span');
        pill.className = 'msg-reaction' + (users.indexOf('partner') !== -1 ? ' mine' : '');
        pill.title = users.length + ' reaction' + (users.length === 1 ? '' : 's');
        pill.innerHTML = emoji + (users.length > 1 ? '<span class="msg-reaction-count">' + users.length + '</span>' : '');
        pill.addEventListener('click', function() { toggleReaction(m.id, emoji); });
        rxWrap.appendChild(pill);
      });
      msgEl.appendChild(rxWrap);
    }

    if (!nextSame) {
      var timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = sentAt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
      msgEl.appendChild(timeEl);
    }

    wrap.appendChild(msgEl);
  });
}

// ── Context panel (Partner-scoped: guest profile, no internal notes, no commercial data) ──
// v74a: houses two tabs — "Guest details" + "🔒 The Bearing" private loop chat
// v74b: tab labels show guest's actual name; both tabs get unread badges so
// you can see at a glance which side has new activity. Badge clears when you
// click the corresponding tab.
function renderContextPanel(conv) {
  var ctx = document.getElementById('context-panel');
  if (!ctx) return;

  // v74b: guest name in tab label (truncated). Falls back to "Guest details"
  // when no name available (anonymous email-only enquiries).
  var guestTabLabel = (conv.guestName || '').trim();
  if (guestTabLabel) {
    if (guestTabLabel.length > 14) guestTabLabel = guestTabLabel.substring(0, 14).replace(/\s+$/, '') + '…';
  } else {
    guestTabLabel = 'Guest details';
  }

  ctx.innerHTML =
    '<div class="ctx-tabs">' +
      '<button class="ctx-tab active" data-tab="guest" type="button" onclick="switchCtxTab(\'guest\')">' +
        '<span class="ctx-tab-icon">👤</span><span>' + escHtml(guestTabLabel) + '</span>' +
        '<span class="ctx-tab-badge" id="ctx-guest-badge" style="display:none;">1</span>' +
      '</button>' +
      '<button class="ctx-tab tab-loop-inactive" data-tab="loop" type="button" onclick="switchCtxTab(\'loop\')">' +
        '<span class="ctx-tab-icon">🔒</span><span>The Bearing</span>' +
        '<span class="ctx-tab-badge" id="ctx-loop-badge" style="display:none;">1</span>' +
      '</button>' +
    '</div>' +
    '<div class="ctx-pane ctx-pane-guest" id="ctx-pane-guest"></div>' +
    '<div class="ctx-pane hidden" id="ctx-pane-loop"></div>';

  renderGuestPane(conv);
  renderLoopPane(conv);
}

// Switch the visible context-panel tab.
// v74b: clicking a tab clears that tab's badge AND calls the appropriate
// mark-read endpoint so the unread counter on the server resets.
function switchCtxTab(which) {
  var tabs = document.querySelectorAll('.ctx-tab');
  tabs.forEach(function(t) {
    if (t.getAttribute('data-tab') === which) t.classList.add('active');
    else t.classList.remove('active');
  });
  var paneGuest = document.getElementById('ctx-pane-guest');
  var paneLoop = document.getElementById('ctx-pane-loop');
  if (which === 'guest') {
    if (paneGuest) paneGuest.classList.remove('hidden');
    if (paneLoop) paneLoop.classList.add('hidden');
    // Clear the guest tab's badge
    var gBadge = document.getElementById('ctx-guest-badge');
    if (gBadge) gBadge.style.display = 'none';
    // No mark-read needed for guest tab — the existing message poll handles
    // markReadFor:'admin' on the main conv when the partner is actively viewing.
  } else {
    if (paneGuest) paneGuest.classList.add('hidden');
    if (paneLoop) paneLoop.classList.remove('hidden');
    var lBadge = document.getElementById('ctx-loop-badge');
    if (lBadge) lBadge.style.display = 'none';
    // v74b: mark loop-read on the server so the badge stays cleared on next poll.
    if (ppActiveId) {
      fetch('/api/loop', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ convId: ppActiveId, action: 'mark_read', slug: PP_SLUG })
      }).catch(function(){});
    }
  }
}

// Render the guest-details pane (the existing context-panel content, now scoped to its tab).
function renderGuestPane(conv) {
  var pane = document.getElementById('ctx-pane-guest');
  if (!pane) return;
  pane.innerHTML = '<div class="conv-loading">Loading guest details…</div>';
  // v74o: privacy — never derive initials from email on the partner side
  var initials = (conv.guestName || '?').split(/\s+/).map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase();

  var html = '';
  html += '<div class="context-header">';
  html += '<div class="context-avatar">';
  if (conv.guestAvatar) html += '<img src="' + escHtml(conv.guestAvatar) + '">';
  else html += escHtml(initials || '?');
  html += '</div>';
  html += '<div class="context-name">' + escHtml(conv.guestName || 'Guest') + '</div>';
  // v74o: removed `<div class="context-email">…</div>`. Partners must
  // never see the guest's email — the whole point of The Bearing in
  // the middle is to keep communication inside the platform.
  html += '<div class="context-presence" id="ctx-presence"></div>';
  html += '</div>';

  // Member basics (partner-appropriate — no LTV, no provider, no notes)
  html += '<div class="context-section">';
  html += '<div class="context-section-title">About</div>';
  html += '<div class="context-row"><span class="context-row-label">Member since</span><span class="context-row-value" id="ctx-joined">—</span></div>';
  html += '<div class="context-row"><span class="context-row-label">Location</span><span class="context-row-value" id="ctx-location">—</span></div>';
  html += '</div>';

  // Enquiry details
  if (conv.enquiry) {
    html += '<div class="context-section">';
    html += '<div class="context-section-title">Enquiry</div>';
    if (conv.enquiry.cabin) html += '<div class="context-row"><span class="context-row-label">Cabin</span><span class="context-row-value">' + escHtml(conv.enquiry.cabin) + '</span></div>';
    if (conv.enquiry.guests) html += '<div class="context-row"><span class="context-row-label">Guests</span><span class="context-row-value">' + escHtml(conv.enquiry.guests) + '</span></div>';
    if (conv.enquiry.arrival) html += '<div class="context-row"><span class="context-row-label">Arrival</span><span class="context-row-value">' + escHtml(conv.enquiry.arrival) + '</span></div>';
    if (conv.enquiry.departure) html += '<div class="context-row"><span class="context-row-label">Departure</span><span class="context-row-value">' + escHtml(conv.enquiry.departure) + '</span></div>';
    html += '</div>';
  }

  // Past conversations with THIS guest on YOUR property only
  html += '<div class="context-section" id="ctx-other-convs-section" style="display:none;">';
  html += '<div class="context-section-title">Previous conversations</div>';
  html += '<div id="ctx-other-convs"></div>';
  html += '</div>';

  pane.innerHTML = html;

  // Presence
  if (window.ConvPresence && conv.guestId) {
    window.ConvPresence.fetchPresence({ guestId: conv.guestId }).then(function(p) {
      var presEl = document.getElementById('ctx-presence');
      if (!presEl) return;
      if (p.guestOnline) presEl.innerHTML = '<span class="online-dot"></span><span style="color:#10b981;font-weight:600;">Online now</span>';
      else if (p.guestLastSeen) presEl.innerHTML = '<span>Last seen ' + escHtml(window.ConvPresence.timeAgo(p.guestLastSeen)) + '</span>';
    }).catch(function(){});
  }

  // Member basics
  if (conv.guestId && conv.guestId.indexOf('user_') === 0) {
    fetch('/api/members?id=' + encodeURIComponent(conv.guestId))
      .then(function(r){ return r.json(); })
      .then(function(md){
        if (!md || !md.data) return;
        var m = md.data;
        var setEl = function(id, val){ var el = document.getElementById(id); if (el) el.textContent = val; };
        setEl('ctx-joined', m.joined_at ? new Date(m.joined_at).toLocaleDateString('en-US', {month:'short', year:'numeric'}) : '—');
        setEl('ctx-location', m.location || '—');
      })
      .catch(function(){});
  }

  // Past conversations on this property only
  // Scope: list conversations for this guest AND filter to property slug
  if (conv.guestId) {
    fetch('/api/conversation?guestId=' + encodeURIComponent(conv.guestId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var other = (d.conversations || []).filter(function(c) {
          return c.id !== conv.id && c.status !== 'archived' && c.propertySlug === PP_SLUG;
        });
        if (!other.length) return;
        var sec = document.getElementById('ctx-other-convs-section');
        var box = document.getElementById('ctx-other-convs');
        if (!sec || !box) return;
        sec.style.display = '';
        box.innerHTML = other.slice(0, 6).map(function(c) {
          var when = c.lastMessageAt ? fmt(c.lastMessageAt) : '';
          var preview = c.lastMessagePreview ? (c.lastMessagePreview.substring(0, 60) + (c.lastMessagePreview.length > 60 ? '…' : '')) : '';
          return '<a class="context-conv-item" href="pp-conversations?id=' + encodeURIComponent(c.id) + '">' +
            '<div class="context-conv-property">' + escHtml(preview || 'Conversation') + '</div>' +
            '<div class="context-conv-meta">' + escHtml(when) + '</div>' +
          '</a>';
        }).join('');
      })
      .catch(function(){});
  }
}

// ── v74a: Loop-in private chat pane ──
// Partner-initiated private side-thread on this conversation. Customer
// never sees this — it lives in conversation:{id}:loop:messages, a key the
// customer renderer doesn't read.
var ppLoopState = { loop: null, messages: [] };
var ppLoopPoll = null;

function renderLoopPane(conv) {
  var pane = document.getElementById('ctx-pane-loop');
  if (!pane) return;
  pane.innerHTML = '<div class="conv-loading">Loading…</div>';

  // Fetch existing loop (if any)
  fetch('/api/loop?convId=' + encodeURIComponent(conv.id) + '&slug=' + encodeURIComponent(PP_SLUG), { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      ppLoopState.loop = d.loop || null;
      ppLoopState.messages = d.messages || [];
      paintLoopPane(conv);
      updateLoopTabBadge();
    })
    .catch(function(e) {
      pane.innerHTML = '<div class="loop-empty"><div class="loop-empty-body" style="color:#b05830;">Could not load private thread. Please reload.</div></div>';
    });

  // Start polling for admin replies. Reuses the same active conv.
  if (ppLoopPoll) { clearInterval(ppLoopPoll); ppLoopPoll = null; }
  ppLoopPoll = setInterval(function() { pollLoop(conv); }, 12000);
}

function pollLoop(conv) {
  if (!conv || !conv.id || conv.id !== ppActiveId) return;
  fetch('/api/loop?convId=' + encodeURIComponent(conv.id) + '&slug=' + encodeURIComponent(PP_SLUG), { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var newCount = (d.messages || []).length;
      var oldCount = (ppLoopState.messages || []).length;
      ppLoopState.loop = d.loop || null;
      ppLoopState.messages = d.messages || [];
      // If admin sent something new, repaint and surface a badge with the
      // server's unreadPartner counter (source of truth — survives reloads).
      if (newCount > oldCount) {
        var activeTab = document.querySelector('.ctx-tab.active');
        var onLoopTab = activeTab && activeTab.getAttribute('data-tab') === 'loop';
        paintLoopPane(conv);
        if (!onLoopTab) {
          var unread = (d.loop && d.loop.unreadPartner) || (newCount - oldCount);
          var badge = document.getElementById('ctx-loop-badge');
          if (badge) { badge.style.display = 'flex'; badge.textContent = unread; }
        } else {
          // Partner is actively viewing — mark read on the server so the
          // sidebar count drops on its next refresh.
          fetch('/api/loop', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ convId: conv.id, action: 'mark_read', slug: PP_SLUG })
          }).catch(function(){});
        }
      } else if (d.loop && d.loop.unreadPartner > 0) {
        // No new messages this tick but the server still reports unread
        // (e.g. badge state on initial conv-switch reload). Show the count.
        var activeTab2 = document.querySelector('.ctx-tab.active');
        var onLoopTab2 = activeTab2 && activeTab2.getAttribute('data-tab') === 'loop';
        if (!onLoopTab2) {
          var badge2 = document.getElementById('ctx-loop-badge');
          if (badge2) { badge2.style.display = 'flex'; badge2.textContent = d.loop.unreadPartner; }
        }
      }
      updateLoopTabBadge();
    })
    .catch(function(){});
}

function updateLoopTabBadge() {
  var tab = document.querySelector('.ctx-tab[data-tab="loop"]');
  if (!tab) return;
  if (ppLoopState.loop && ppLoopState.loop.active) {
    tab.classList.remove('tab-loop-inactive');
  } else {
    // No loop yet, or resolved — softer styling
    if (!ppLoopState.loop) tab.classList.add('tab-loop-inactive');
    else tab.classList.remove('tab-loop-inactive');
  }
}

function paintLoopPane(conv) {
  var pane = document.getElementById('ctx-pane-loop');
  if (!pane) return;
  var hasLoop = !!ppLoopState.loop;
  var isResolved = hasLoop && !ppLoopState.loop.active;

  var headerHtml = '';
  if (!hasLoop) {
    headerHtml =
      '<div class="loop-header">' +
        '<div class="loop-header-title"><span>🔒</span><span>Loop in The Bearing</span></div>' +
        '<div class="loop-header-sub">Send a private message to The Bearing. The guest cannot see anything in this thread. We&rsquo;ll get an immediate alert.</div>' +
      '</div>';
  } else {
    var statusLabel = isResolved
      ? 'Resolved — send a new message to reopen'
      : 'Active — The Bearing has been notified';
    headerHtml =
      '<div class="loop-header">' +
        '<div class="loop-header-title"><span>🔒</span><span>Private — The Bearing only</span></div>' +
        '<div class="loop-header-sub">The guest cannot see this thread. Messages go straight to admin@thebearing.io.</div>' +
        '<span class="loop-header-status' + (isResolved ? ' resolved' : '') + '">' + escHtml(statusLabel) + '</span>' +
      '</div>';
  }

  var messagesHtml = '';
  if (!hasLoop || (ppLoopState.messages || []).length === 0) {
    messagesHtml =
      '<div class="loop-empty">' +
        '<div class="loop-empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>' +
        '<div class="loop-empty-title">No messages yet</div>' +
        '<div class="loop-empty-body">Type below to start a private conversation with The Bearing. We&rsquo;ll be notified immediately.</div>' +
      '</div>';
  } else {
    messagesHtml = '<div class="loop-messages" id="loop-messages-wrap">' +
      ppLoopState.messages.map(function(m) {
        var role = m.role === 'admin' ? 'admin' : 'partner';
        var when = '';
        try { when = fmt(new Date(m.sentAt)); } catch(_) { when = ''; }
        return '<div class="loop-msg role-' + role + '">' +
          '<div class="loop-msg-sender">' + escHtml(m.senderName || (role === 'admin' ? 'The Bearing' : 'You')) + '</div>' +
          '<div class="loop-msg-bubble">' + escHtml(m.text || '') + '</div>' +
          '<div class="loop-msg-time">' + escHtml(when) + '</div>' +
        '</div>';
      }).join('') +
      '</div>';
  }

  var composerHtml =
    '<div class="loop-composer">' +
      '<div class="loop-composer-label"><span>🔒</span><span>Private to The Bearing</span></div>' +
      '<div class="loop-composer-row">' +
        '<textarea id="loop-composer-input" placeholder="What do you need help with?" rows="1"></textarea>' +
        '<button class="loop-send" id="loop-send-btn" type="button" onclick="sendLoopMessage()">Send</button>' +
      '</div>' +
    '</div>';

  pane.innerHTML = headerHtml + messagesHtml + composerHtml;

  // Auto-resize textarea + Enter-to-send
  var ta = document.getElementById('loop-composer-input');
  if (ta) {
    ta.addEventListener('input', function() {
      ta.style.height = 'auto';
      ta.style.height = Math.min(140, ta.scrollHeight) + 'px';
    });
    ta.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        sendLoopMessage();
      }
    });
    ta.focus();
  }

  // Scroll to bottom of messages
  var wrap = document.getElementById('loop-messages-wrap');
  if (wrap && window.pinToBottom) window.pinToBottom(wrap);
}

function sendLoopMessage() {
  if (!ppActiveId) return;
  var ta = document.getElementById('loop-composer-input');
  var btn = document.getElementById('loop-send-btn');
  if (!ta || !btn) return;
  var text = (ta.value || '').trim();
  if (!text) return;
  btn.disabled = true;
  fetch('/api/loop', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ convId: ppActiveId, slug: PP_SLUG, text: text })
  })
    .then(function(r) {
      if (!r.ok) throw new Error('send failed (' + r.status + ')');
      return r.json();
    })
    .then(function(d) {
      ppLoopState.loop = d.loop || ppLoopState.loop;
      if (d.message) ppLoopState.messages.push(d.message);
      ta.value = '';
      ta.style.height = 'auto';
      // Re-render with the new message in place
      var conv = (ppConvs || []).filter(function(c){return c.id === ppActiveId;})[0];
      if (conv) paintLoopPane(conv);
      updateLoopTabBadge();
    })
    .catch(function(e) {
      console.error('[loop send]', e);
      alert('Could not send. Please try again.');
    })
    .finally(function() { btn.disabled = false; });
}

// ── Reactions ──
function toggleReaction(messageId, emoji) {
  if (!ppActiveId || !messageId) return;
  fetch('/api/conversation', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      action: 'reaction',
      id: ppActiveId,
      messageId: messageId,
      emoji: emoji,
      role: 'partner',
      userId: 'partner'
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){ if (d.ok) refreshThread(); });
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.msg-action-emoji-picker')) {
    document.querySelectorAll('.msg-action-emoji-picker.open').forEach(function(el) {
      el.classList.remove('open');
      var pa = el.closest('.msg-actions'); if (pa) pa.classList.remove('actions-pinned');
    });
  }
});

// ── Reply quote ──
function quoteMessage(sender, text) {
  quotedMessage = { sender: sender, text: text };
  renderQuoteUi();
  var input = document.getElementById('pp-reply-input');
  if (input) input.focus();
}
function renderQuoteUi() {
  var container = document.querySelector('.reply-container');
  if (!container) return;
  var existing = container.querySelector('.reply-quote');
  if (existing) existing.remove();
  if (!quotedMessage) return;
  var q = document.createElement('div');
  q.className = 'reply-quote';
  q.innerHTML = '<div class="reply-quote-bar"></div>' +
    '<div class="reply-quote-content">' +
      '<div class="reply-quote-label">Replying to ' + escHtml(quotedMessage.sender) + '</div>' +
      '<div class="reply-quote-text">' + escHtml(quotedMessage.text) + '</div>' +
    '</div>' +
    '<button class="reply-quote-close" onclick="clearQuote()">×</button>';
  container.insertBefore(q, container.firstChild);
}
function clearQuote() {
  quotedMessage = null;
  renderQuoteUi();
}

// ── Copy & flash ──
function copyToClipboard(text) {
  var flash = document.getElementById('copy-flash');
  function showFlash() {
    if (!flash) return;
    flash.classList.add('show');
    setTimeout(function() { flash.classList.remove('show'); }, 1400);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showFlash).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      showFlash();
    });
  }
}

// ── Sound ──
function playNotificationSound() {
  if (!soundEnabled) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(); osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}
function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('tb_pp_sound', soundEnabled ? 'on' : 'off');
  paintSoundToggle();
}
function paintSoundToggle() {
  var btn = document.getElementById('sound-toggle');
  if (!btn) return;
  btn.classList.toggle('muted', !soundEnabled);
  btn.title = soundEnabled ? 'Sounds on — click to mute' : 'Sounds off — click to enable';
  btn.innerHTML = soundEnabled
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg><span>Sound</span>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg><span>Muted</span>';
}

function sendReply() {
  var input = document.getElementById('pp-reply-input');
  var text = input ? input.value.trim() : '';
  if (!text || !ppActiveId) return;

  if (quotedMessage) {
    var quoteLines = quotedMessage.text.split('\n').map(function(l){ return '> ' + l; }).join('\n');
    text = '> ' + quotedMessage.sender + ' wrote:\n' + quoteLines + '\n\n' + text;
    quotedMessage = null;
    renderQuoteUi();
  }

  input.value = '';
  input.style.height = 'auto';
  input.disabled = true;

  fetch('/api/conversation', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({action:'message', id:ppActiveId, role:'partner', text:text, senderName: PP_NAME})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    input.disabled = false;
    if (d.ok) refreshThread();
  })
  .catch(function(){ input.disabled = false; });
}

function refreshThread() {
  if (!ppActiveId) return;
  fetch('/api/conversation?id=' + encodeURIComponent(ppActiveId))
    .then(function(r){ return r.json(); })
    .then(function(d){ refreshMessages(d.conversation, d.messages||[]); });
}

function refreshMessages(conv, messages) {
  var wrap = document.getElementById('pp-msgs-wrap');
  if (!wrap) return;
  // v74l: capture scroll state BEFORE re-rendering. renderMessagesInto
  // does wrap.innerHTML = '' which resets scrollTop to 0, so we'd lose
  // the user's actual scroll position if we measured after. Prevents
  // the 5-second poll from yanking a partner out of message history.
  var wasAtBottom = window.wasAtBottom ? window.wasAtBottom(wrap) : true;
  var prevCount = lastMsgCount[conv.id] || 0;
  var newCount = messages.length;
  var newFromOther = false;
  if (newCount > prevCount && prevCount > 0) {
    for (var i = prevCount; i < newCount; i++) {
      if (messages[i] && messages[i].role !== 'partner') { newFromOther = true; break; }
    }
  }
  lastMsgCount[conv.id] = newCount;
  renderMessagesInto(wrap, conv, messages);
  if (newFromOther && newCount > prevCount) {
    var allMsgEls = wrap.querySelectorAll('.msg');
    var toAnimate = newCount - prevCount;
    for (var i = allMsgEls.length - toAnimate; i < allMsgEls.length; i++) {
      if (allMsgEls[i]) allMsgEls[i].classList.add('msg-new');
    }
    playNotificationSound();
    // v74m: surface "↓ N new messages" pill if partner is scrolled up.
    // ConvScroll.showNewMessagesPill is no-op if partner is at bottom.
    if (ppScrollControls && typeof ppScrollControls.showNewMessagesPill === 'function') {
      ppScrollControls.showNewMessagesPill(toAnimate);
    }
    // v74b: if partner is currently on the loop tab, surface a guest-tab
    // badge with the count of new main-thread messages so they don't miss
    // the guest while focused on the private chat.
    var activeTab = document.querySelector('.ctx-tab.active');
    var onLoopTab = activeTab && activeTab.getAttribute('data-tab') === 'loop';
    if (onLoopTab) {
      var gBadge = document.getElementById('ctx-guest-badge');
      if (gBadge) {
        var prev = parseInt(gBadge.textContent, 10) || 0;
        if (gBadge.style.display === 'none' || !gBadge.style.display) prev = 0;
        gBadge.textContent = prev + (newCount - prevCount);
        gBadge.style.display = 'flex';
      }
    }
  }
  // v74l: only pin if partner was already at bottom. Scrolled-up partners stay put.
  window.pinToBottom(wrap, { observe: false, force: wasAtBottom });
}

function startPoll(id) {
  if (ppPoll) clearInterval(ppPoll);
  ppPoll = setInterval(function(){ if(ppActiveId===id) refreshThread(); }, 5000);
}

// ── Presence ──
if (window.ConvPresence) {
  window.ConvPresence.startHeartbeat({ role: 'partner', slug: PP_SLUG });
  window.ConvPresence.onVisible(function() {
    window.ConvPresence.setUnreadInTitle(0);
    window.ConvPresence.drawFaviconDot(false);
  });
}

function ppUpdateUnreadIndicator() {
  if (!window.ConvPresence) return;
  var total = 0;
  ppConvs.forEach(function(c) { total += (c.unreadAdmin || 0); });
  window.ConvPresence.setUnreadInTitle(total);
  window.ConvPresence.drawFaviconDot(total > 0);
}

// Periodic list refresh
setInterval(function() {
  fetch('/api/conversation?slug=' + PP_SLUG)
    .then(function(r){ return r.json(); })
    .then(function(d) {
      ppConvs = (d.conversations || []).filter(function(c){ return c.status !== 'archived'; });
      ppUpdateUnreadIndicator();
    }).catch(function(){});
}, 15000);

loadConvs();
paintSoundToggle();
fetchPartnerIdentity(); // v73g: pull partner display name from KV
</script>
<script src="/assets/pp-sidebar-badges.js"></script>
